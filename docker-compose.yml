services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: renta_ia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: renta_ia
    ports:
      - "5433:5432"
    volumes:
      - renta_ia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  renta_ia_pgdata:
